<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FastShip – Seller dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23f5c518%27/%3E%3Cg fill=%27none%27 stroke=%27%232b2200%27 stroke-width=%273.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M14 25l4.2-18H26M15.5 16h8%27/%3E%3Cpath d=%27M5 12h6M4 19h6%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--text:#14213d;--muted:#667085;--line:#e2e6ee;--brand:#2f5bea;--brand-ink:#fff;--tape:#f5c518;--tape-ink:#2b2200;--ok:#12805c;--okb:#e1f5ec;--warn:#9a5b00;--warnb:#fdf0d5;--bad:#b42318;--badb:#fde8e6;--info:#1d4ed8;--infob:#e3ebfd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--surface:#161f30;--text:#e8edf7;--muted:#98a2b8;--line:#27334a;--brand:#6c8cff;--brand-ink:#0b1020;--okb:#12352b;--ok:#5fd3a4;--warnb:#3a2c0c;--warn:#f2c066;--badb:#3d1a17;--bad:#ff8f84;--infob:#1b2a52;--info:#9db6ff}}
:root[data-theme="dark"]{--bg:#0e1522;--surface:#161f30;--text:#e8edf7;--muted:#98a2b8;--line:#27334a;--brand:#6c8cff;--brand-ink:#0b1020;--okb:#12352b;--ok:#5fd3a4;--warnb:#3a2c0c;--warn:#f2c066;--badb:#3d1a17;--bad:#ff8f84;--infob:#1b2a52;--info:#9db6ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;padding:4px 10px 18px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--tape);display:grid;place-items:center;color:var(--tape-ink);font-style:normal;font-weight:700}
.nav button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;text-align:left}
.nav button:hover{background:var(--bg);color:var(--text)}
.nav button.on{background:var(--infob);color:var(--info);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.menu{display:none;border:1px solid var(--line);background:none;border-radius:8px;width:38px;height:38px;cursor:pointer}
.search{flex:1;max-width:420px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px}
.sp{flex:1}
.wallet{background:var(--tape);color:var(--tape-ink);border:0;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer}
.ib{border:1px solid var(--line);background:none;border-radius:9px;width:38px;height:38px;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.page{padding:24px;max-width:1200px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:14px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.pipe{margin-bottom:16px}
.pipe h2,.card h2{font-size:15px;margin:0 0 12px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.stage{position:relative;padding:12px 14px;border-top:4px solid var(--c);background:linear-gradient(var(--bg),var(--bg));}
.stage+.stage{border-left:2px solid var(--surface)}
.stage b{display:block;font-size:26px;line-height:1.1}
.stage span{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi b{display:block;font-size:22px;margin-top:2px}
.kpi span{color:var(--muted);font-size:13px}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);gap:4px}
.bars i{display:block;width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:3px}
.hb{margin-bottom:10px}.hb div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.hb i{display:block;height:8px;border-radius:4px;background:var(--brand)}
.hb p{margin:0;background:var(--bg);border-radius:4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.b.ok{background:var(--okb);color:var(--ok)}.b.warn{background:var(--warnb);color:var(--warn)}.b.bad{background:var(--badb);color:var(--bad)}.b.info{background:var(--infob);color:var(--info)}.b.mut{background:var(--bg);color:var(--muted)}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.sec{background:none;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:13px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-size:13px;color:var(--muted)}
input,select{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.stat{margin:14px 0;display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.stat b{color:var(--text)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
input[type=checkbox]{width:auto;margin:0}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:18;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));overflow:auto;transform:translateX(100%);transition:transform .2s}
.dr.open{transform:none}
.tl{list-style:none;margin:18px 0;padding:0}
.tl li{position:relative;padding:0 0 18px 26px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:3px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--line)}
.tl li::after{content:"";position:absolute;left:8px;top:16px;bottom:-5px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--text)}.tl li.done::before{background:var(--ok)}
.tl li.cur{font-weight:600}.tl li.cur::before{box-shadow:0 0 0 4px var(--okb)}
.tl li.bad{color:var(--bad)}.tl li.bad::before{background:var(--bad);box-shadow:0 0 0 4px var(--badb)}
#login{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;grid-template-columns:1fr 1fr;overflow:auto}
#login .hero{background:var(--text);color:var(--bg);padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
#login .hero h2{font-size:32px;line-height:1.15;margin:0;letter-spacing:-.02em;max-width:14em}
#login .hero p{margin:0;opacity:.75;max-width:30em}
#login .box{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:440px;width:100%;margin:auto}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--brand);font-weight:600}
.muted{color:var(--muted)}label small{display:block;margin-top:4px;font-size:12px;min-height:16px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;text-decoration:underline}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.cg button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cg button.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--infob)}
button.av{border:0;cursor:pointer;font-size:15px}
@media (max-width:900px){#login{grid-template-columns:1fr}#login .hero{padding:28px}#login .box{padding:24px}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.scrim{display:none}
@media (max-width:900px){
.app{grid-template-columns:1fr}
.side{position:fixed;left:0;top:0;z-index:15;width:250px;transform:translateX(-100%);transition:transform .2s}
.side.open{transform:none}
.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:12}
.menu{display:block}.top{padding:10px 14px}.search{display:none}.page{padding:16px}
.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}
.flow{grid-template-columns:repeat(2,1fr);gap:8px}.stage+.stage{border-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login"></div>
<div class="app" style="display:none">
<aside class="side" id="side">
<div class="logo"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 19l3.2-14H20M11.8 12h6"/><path d="M3 9h5M2 14h5"/></svg></i>FastShip</div>
<nav class="nav" id="nav"></nav>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
<header class="top">
<button class="menu" id="menu" aria-label="Open menu">☰</button>
<input class="search" placeholder="Search order ID, AWB or phone" aria-label="Search">
<span class="sp"></span>
<button class="wallet" id="wb" data-go="Wallet">₹12,480</button>
<button class="ib" id="theme" aria-label="Switch theme">◐</button>
<button class="ib" data-toast="You have 3 new alerts: 2 NDR, 1 KYC" aria-label="Notifications">🔔</button>
<button class="av" id="out" aria-label="Log out" title="Log out">R</button>
</header>
<main class="page" id="page"></main>
</div>
</div>
<aside class="dr" id="dr" aria-label="Shipment details"></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const ic={Dashboard:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
Orders:'<path d="M6 2h12l2 5v14H4V7z"/><path d="M4 7h16M9 11h6"/>',Shipments:'<path d="M1 6h13v10H1zM14 10h5l3 3v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
'Rate calculator':'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2"/>',NDR:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
RTO:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',COD:'<circle cx="12" cy="12" r="9"/><path d="M9 9h5a2 2 0 0 1 0 4H9l5 4"/>',
Wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4v4M17 14h2"/>',Reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
Integrations:'<path d="M9 7V2M15 7V2M6 7h12v5a6 6 0 0 1-12 0zM12 18v4"/>',API:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16"/>',Support:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/>'};
const pages=Object.keys(ic);let cur='Dashboard',range='Last 7 days';

const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const badge=s=>{const m={Delivered:'ok','In transit':'info','Out for delivery':'info',NDR:'warn','RTO initiated':'bad','Pickup scheduled':'mut','Ready to ship':'mut',Cancelled:'bad'};return`<span class="b ${m[s]||'mut'}">${s}</span>`};
const DEMO_ORDERS=[
['FS-10482','Aarav Mehta','Pune 411001','Prepaid',1299,'Delhivery','DL7788120934','Delivered'],
['FS-10481','Sneha Iyer','Chennai 600042','COD',899,'Xpressbees','XB4410029871','Out for delivery'],
['FS-10480','Rohit Verma','Lucknow 226010','COD',1599,'Ekart','EK2200918347','NDR'],
['FS-10479','Pooja Nair','Kochi 682016','Prepaid',2499,'Blue Dart','BD9001173620','In transit'],
['FS-10478','Imran Khan','Jaipur 302017','COD',749,'DTDC','DT5532018846','RTO initiated'],
['FS-10477','Kavya Reddy','Hyderabad 500081','Prepaid',3199,'Delhivery','DL7788120102','In transit'],
['FS-10476','Vikram Singh','Delhi 110045','COD',1099,'Shadowfax','SF1208873345','Delivered'],
['FS-10475','Anita Desai','Surat 395007','Prepaid',1850,'—','—','Ready to ship'],
['FS-10474','Manoj Gupta','Patna 800001','COD',999,'Xpressbees','XB4410029455','Pickup scheduled'],
['FS-10473','Divya Rao','Mysuru 570001','Prepaid',1450,'—','—','Cancelled']];
let orders=DEMO_ORDERS.map(o=>[...o]);
const ranges={'Today':[.14,.14],'Yesterday':[.13,.13],'Last 7 days':[1,1],'Last 30 days':[4.2,4.2],'Custom date':[2.2,2.2]};
function dash(){if(!orders.length)return`<h1>Welcome, ${esc(me.name)}</h1><p class="sub">Your dashboard fills up as you ship. Start with these steps.</p><div class="card"><div class="stat" style="flex-direction:column;gap:8px"><span>${kyc.status==='Approved'?'✓':'○'} Complete KYC <b>(${kyc.status})</b></span><span>${bal()>0?'✓':'○'} Add money to your wallet</span><span>○ Create your first order</span></div><div class="chips"><button class="btn" data-go="KYC">Go to KYC</button><button class="btn sec" data-go="Wallet">Add money</button><button class="btn sec" data-neworder>Create order</button></div></div>`;const k=ranges[range][0];const n=v=>Math.round(v*k).toLocaleString('en-IN');
const days=[62,78,71,95,88,110,84].map(v=>Math.round(v*(range==='Today'?1:1)));
const st=[['Pickup scheduled',48,'#8a94a8'],['Picked up',36,'#2f5bea'],['In transit',212,'#2f5bea'],['Out for delivery',64,'#e0a800'],['Delivered',518,'#12805c']];
return`<div class="row"><div><h1>Dashboard</h1><p class="sub" style="margin:0">Your shipping at a glance</p></div>
<div class="chips">${Object.keys(ranges).map(r=>`<button class="chip ${r===range?'on':''}" data-range="${r}">${r}</button>`).join('')}</div></div>
<section class="card pipe"><h2>Shipment pipeline</h2><div class="flow">${st.map(s=>`<div class="stage" style="--c:${s[2]}"><b>${n(s[1])}</b><span>${s[0]}</span></div>`).join('')}</div></section>
<div class="kpis">
<div class="card kpi"><span>Total orders</span><b>${n(612)}</b><em class="up">▲ 8.2% vs previous</em></div>
<div class="card kpi"><span>COD pending</span><b>${inr(184500*k)}</b><em class="muted">Next settlement in 2 days</em></div>
<div class="card kpi"><span>Shipping spend</span><b>${inr(48230*k)}</b><em>Avg ${inr(79)} per shipment</em></div>
<div class="card kpi"><span>Wallet balance</span><b>${inr(bal())}</b><em>Top up from Wallet</em></div>
<div class="card kpi"><span>Delivered</span><b>92.4%</b><em class="up">▲ 1.1%</em></div>
<div class="card kpi"><span>RTO</span><b>6.8%</b><em class="up">▼ 0.6%</em></div>
<div class="card kpi"><span>NDR to act on</span><b>${n(23)}</b><em class="dn">Action needed</em></div>
<div class="card kpi"><span>Cancelled</span><b>${n(14)}</b><em>2.3% of orders</em></div></div>
<div class="grid2"><section class="card"><h2>Orders by day</h2><div class="bars">${days.map((v,i)=>`<div><span>${v}</span><i style="height:${v*1.25}px"></i>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</div>`).join('')}</div></section>
<section class="card"><h2>Courier delivery rate</h2>${[['Delhivery',94],['Xpressbees',91],['Ekart',88],['Blue Dart',96],['DTDC',85]].map(c=>`<div class="hb"><div><span>${c[0]}</span><b>${c[1]}%</b></div><p><i style="width:${c[1]}%"></i></p></div>`).join('')}</section></div>
<section class="card"><h2>Needs your attention</h2><div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Issue</th><th>Courier</th><th></th></tr>
<tr><td>FS-10480</td><td>Rohit Verma</td><td><span class="b warn">NDR: customer unavailable</span></td><td>Ekart</td><td><button class="btn sm" data-toast="Reattempt requested for FS-10480">Reattempt</button></td></tr>
<tr><td>FS-10478</td><td>Imran Khan</td><td><span class="b bad">RTO initiated</span></td><td>DTDC</td><td><button class="btn sm sec" data-track="FS-10478">View</button></td></tr></table></div></section>`}
let q='',sf='All';
function ord(){const list=orders.filter(o=>(sf==='All'||o[7]===sf)&&(o.join(' ').toLowerCase().includes(q)));
const sts=['All','Ready to ship','In transit','Out for delivery','Delivered','NDR','RTO initiated','Cancelled'];
return`<div class="row"><div><h1>Orders</h1><p class="sub" style="margin:0">${list.length} of ${orders.length} orders</p></div>
<div class="chips"><button class="btn sec" data-toast="Template downloaded: fastship-orders.csv">Download CSV template</button><button class="btn sec" data-toast="Choose a CSV or Excel file to upload">Bulk upload</button><button class="btn" data-neworder>Create order</button></div></div>
<div class="card"><div class="row"><input id="oq" style="max-width:320px;margin:0" placeholder="Search orders" value="${esc(q)}"><div class="chips">${sts.map(s=>`<button class="chip ${s===sf?'on':''}" data-sf="${s}">${s}</button>`).join('')}</div></div>
${list.length?`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Destination</th><th>Payment</th><th>Value</th><th>Courier</th><th>AWB</th><th>Status</th><th></th></tr>
${list.map(o=>`<tr><td><b>${o[0]}</b></td><td>${esc(o[1])}</td><td>${esc(o[2])}</td><td>${o[3]==='COD'?'<span class="b warn">COD</span>':'<span class="b mut">Prepaid</span>'}</td><td>${inr(o[4])}</td><td>${o[5]}</td><td>${o[6]}</td><td>${badge(o[7])}</td>

<section class="card"><h2>Courier performance</h2><div class="tw"><table><tr><th>Courier</th><th>Shipments</th><th>Delivered</th><th>RTO</th><th>Status</th></tr>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table></div></section>`}
function asel(){return`<h1>Sellers</h1><p class="sub">${sellers.length} registered sellers</p><div class="card tw"><table><tr><th>Business</th><th>City</th><th>KYC</th><th>Wallet</th><th>Shipments (30d)</th><th>Account</th><th></th></tr>${sellers.map((s,i)=>`<tr><td><b>${esc(s[0])}</b></td><td>${esc(s[1])}</td><td>${kb(s[2])}</td><td>${inr(s[3])}</td><td>${s[4]}</td><td>${s[5]?'<span class="b ok">Active</span>':'<span class="b bad">Suspended</span>'}</td><td><button class="btn sm sec" data-tog="${i}">${s[5]?'Suspend':'Activate'}</button></td></tr>`).join('')}</table></div>`}
function akyc(){const q=sellers.map((s,i)=>[s,i]).filter(x=>x[0][2]==='Under review');
return`<h1>KYC review</h1><p class="sub">${q.length} waiting for a decision</p><div class="card">${q.length?`<div class="tw"><table><tr><th>Business</th><th>City</th><th>Documents</th><th>Decision</th></tr>${q.map(([s,i])=>`<tr><td><b>${esc(s[0])}</b></td><td>${esc(s[1])}</td><td><button class="btn sm sec" data-toast="Document viewer opens here">View documents</button></td><td><div class="chips"><button class="btn sm" data-kyc="approve" data-i="${i}">Approve</button><button class="btn sm sec" data-kyc="changes" data-i="${i}">Request changes</button><button class="btn sm sec" data-kyc="reject" data-i="${i}">Reject</button></div></td></tr>`).join('')}</table></div>`:'<div class="empty">No KYC submissions waiting.</div>'}</div>`}
function acour(){const on=cc===0,n=cl[cc];
return`<h1>Couriers</h1><p class="sub">Connect courier partners. Each one is a separate adapter on the server.</p><div class="cg">${cl.map((c,i)=>`<button data-cc="${i}" class="${i===cc?'on':''}"><b>${c}</b>${i?'<span class="b mut">Not connected</span>':'<span class="b ok">Connected, live</span>'}</button>`).join('')}</div>
<div class="card"><h2>${n}</h2>${on?`<div class="form"><label>Environment<select><option>Production</option><option>Staging</option></select></label><label>Pickup warehouse name<input placeholder="As registered with ${n}"></label><label>API token<input value="Stored on the server" disabled></label><label>Safety mode<select><option>Dry run (read only)</option><option>Live shipments</option></select></label></div>
<div class="chips" style="margin-top:12px">${['COD','Prepaid','RTO','Reverse pickup','International'].map((x,i)=>`<label style="display:flex;gap:6px;align-items:center;color:var(--text)"><input type="checkbox" ${i<4?'checked':''}> ${x}</label>`).join('')}</div>
<div class="chips" style="margin-top:14px"><button class="btn" data-toast="Settings saved">Save settings</button><button class="btn sec" data-toast="Demo result only: the real connection test runs on your server">Test connection</button></div><p class="sub" style="font-size:13px;margin:12px 0 0">Secrets never go in this page. They live in the server's .env file and are encrypted at rest.</p>`:`<p class="sub">Not connected yet. Adding ${n} means writing its adapter on the server and adding its credentials there.</p><button class="btn sec" data-toast="${n} adapter queued for the next build">Queue ${n} adapter</button>`}</div>`}
function amar(){return`<h1>Rates and margin</h1><p class="sub">Sellers only ever see the Seller price column. Cost and margin stay internal.</p><div class="card tw"><table><tr><th>Courier</th><th>Courier cost (500 g, Zone C)</th><th>Margin %</th><th>Seller price</th><th>Your margin</th></tr>${Object.keys(cost).map(c=>{const p=Math.round(cost[c]*(1+mg[c]/100));return`<tr><td><b>${c}</b></td><td>${inr(cost[c])}</td><td><input type="number" min="0" max="100" value="${mg[c]}" data-mg="${c}" style="width:80px;margin:0" aria-label="${c} margin percent"></td><td><b>${inr(p)}</b></td><td class="up">${inr(p-cost[c])}</td></tr>`}).join('')}</table></div>`}
function newOrder(){
 if(kyc.status!=='Approved'){toast('Get your KYC approved before creating shipments');return}
 $('#dr').innerHTML=`<div class="row"><h1 style="font-size:20px;margin:0">Create order</h1><button class="ib" data-close aria-label="Close">✕</button></div>
 <label>Customer name<input id="on"></label><label style="margin-top:10px">Phone<input id="op" inputmode="numeric" maxlength="10"></label>
 <label style="margin-top:10px">Address<input id="oa"></label>
 <label style="margin-top:10px">Pincode<input id="oz" data-pin="ozh" data-fill="oc" inputmode="numeric" maxlength="6"><small id="ozh"></small></label>
 <label style="margin-top:10px">City and state<input id="oc" readonly placeholder="Filled from pincode"></label>
 <label style="margin-top:10px">Product<input id="opr"></label><label style="margin-top:10px">Order value (₹)<input id="ov" type="number" min="1"></label>
 <label style="margin-top:10px">Weight (kg)<input id="ow" type="number" step="0.1" min="0.1" value="0.5"></label>
 <label style="margin-top:10px">Payment<select id="om"><option>Prepaid</option><option>COD</option></select></label>
 <div class="err" id="oe" role="alert"></div><button class="btn" data-ordsave>Save order</button>`;
 $('#dr').classList.add('open')}
async function saveOrder(){const g=i=>$(i).value.trim(),e=m=>{$('#oe').textContent=m};
 if(!g('#on')||!g('#oa')||!g('#opr'))return e('Enter customer name, address and product.');
 if(!/^[6-9]\d{9}$/.test(g('#op')))return e('Enter a valid 10-digit mobile number.');
 if(!(+g('#ov')>0)||!(+g('#ow')>0))return e('Enter a value and weight above 0.');
 const i=await pinInfo(g('#oz'));if(i.reason==='invalid')return e('Pincode not found.');
 const id='FS-'+(10483+orders.filter(o=>+o[0].slice(3)>10482).length);
 orders.unshift([id,g('#on'),(i.ok?i.city:'—')+' '+g('#oz'),$('#om').value,+g('#ov'),'—','—','Ready to ship',{phone:g('#op'),addr:g('#oa'),pin:g('#oz'),city:i.ok?i.city:'',state:i.ok?i.state:'',prod:g('#opr'),kg:+g('#ow')}]);
 $('#dr').classList.remove('open');toast('Order '+id+' created. Choose a courier next.');render()}
function other(p){return`<h1>${p}</h1><p class="sub">This screen is queued for the next design pass.</p><div class="card empty">Dashboard, Orders and Rate calculator are ready to review. Tell me which screen to design next.</div>`}
function render(){const ad=role==='admin';$('#wb').style.display=ad?'none':'';$('#wb').textContent=inr(bal());$('#out').textContent=ad?'A':'R';
const v=(ad?{Overview:aov,Sellers:asel,'KYC review':akyc,Couriers:acour,'Rates & margin':amar}:{Dashboard:dash,Orders:ord,Shipments:ship,'Rate calculator':rate,NDR:ndrp,Wallet:wallet,KYC:kycp})[cur];$('#page').innerHTML=v?v():other(cur);
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===cur));
if(cur==='Rate calculator'){$('#rgo').onclick=calc;calc()}
const oq=$('#oq');if(oq)oq.oninput=e=>{q=e.target.value.toLowerCase();const pos=e.target.selectionStart;render();const n=$('#oq');n.focus();n.setSelectionRange(pos,pos)}}
// ---------- Live shipping through the FastShip server (same address that serves this page) ----------
const SRV={token:null,health:null};
async function sapi(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json',...(SRV.token?{Authorization:'Bearer '+SRV.token}:{})},body:b?JSON.stringify(b):undefined});
 let d=null;try{d=await r.json()}catch{}
 if(!r.ok){if(r.status===401)SRV.token=null;const e=new Error((d&&d.error)||'Server error '+r.status);e.status=r.status;throw e}return d}
async function shipNow(id){const o=orders.find(x=>x[0]===id);if(!o)return;
 $('#dr').innerHTML=`<div class="row"><h1 style="font-size:20px;margin:0">Ship ${esc(id)}</h1><button class="ib" data-close aria-label="Close">✕</button></div><p class="sub">Checking the shipping server...</p>`;$('#dr').classList.add('open');
 try{SRV.health=await sapi('GET','/api/health')}catch{SRV.health=null}
 shipForm(o)}
function shipForm(o,msg){const id=o[0],d=o[8]||{},h=SRV.health,m=(o[2].match(/^(.*?)\s*(\d{6})$/)||[]);
 const head=`<div class="row"><h1 style="font-size:20px;margin:0">Ship ${esc(id)}</h1><button class="ib" data-close aria-label="Close">✕</button></div>`;
 if(!h)return $('#dr').innerHTML=head+`<div class="card"><b>Shipping server not connected</b><p class="sub" style="font-size:13px">Real shipments are created by the FastShip server, not by this page alone. Open the panel from your server address (for example http://localhost:3000/app/) after starting it. Steps are in the README.</p></div>`;
 if(!h.couriers.length)return $('#dr').innerHTML=head+`<div class="card"><b>No courier configured</b><p class="sub" style="font-size:13px">Add DELHIVERY_API_TOKEN to the server's .env file and restart it.</p></div>`;
 if(!SRV.token)return $('#dr').innerHTML=head+`<p class="sub">Enter the server password (ADMIN_PASSWORD from the .env file) to ship.</p><label>Server password<input id="spw" type="password" autocomplete="off"></label><div class="err" id="se" role="alert">${esc(msg||'')}</div><button class="btn" data-srvlogin data-oid="${esc(id)}">Connect</button>`;
 const pay=o[3];
 $('#dr').innerHTML=head+`<p class="sub">${esc(o[1])}, ${pay==='COD'?'COD '+inr(o[4]):'Prepaid '+inr(o[4])}</p>
 <label>Courier<select id="sc">${h.couriers.map(c=>`<option value="${esc(c)}">${esc(c[0].toUpperCase()+c.slice(1))}</option>`).join('')}</select></label>
 <label style="margin-top:10px">Phone<input id="sph" inputmode="numeric" maxlength="10" value="${esc(d.phone||'')}"></label>
 <label style="margin-top:10px">Address<input id="sad" value="${esc(d.addr||'')}"></label>
 <label style="margin-top:10px">Pincode<input id="spn" inputmode="numeric" maxlength="6" value="${esc(d.pin||m[2]||'')}"></label>
 <label style="margin-top:10px">City<input id="sci" value="${esc(d.city||m[1]||'')}"></label>
 <label style="margin-top:10px">State<input id="sst" value="${esc(d.state||'')}"></label>
 <label style="margin-top:10px">Product<input id="spr" value="${esc(d.prod||'')}"></label>
 <label style="margin-top:10px">Weight (kg)<input id="swt" type="number" step="0.1" min="0.1" value="${d.kg||0.5}"></label>
 <div class="err" id="se" role="alert">${esc(msg||'')}</div><button class="btn" data-shipgo="${esc(id)}">Create shipment</button>
 <p class="sub" style="font-size:12px;margin-top:10px">Your server decides if this is a dry run or a real booking (DELHIVERY_DRY_RUN in .env).</p>`}
async function srvLogin(){const oid=document.querySelector('[data-srvlogin]').dataset.oid,o=orders.find(x=>x[0]===oid);
 try{SRV.token=(await sapi('POST','/api/login',{password:$('#spw').value})).token;shipForm(o)}catch(e){shipForm(o,e.message)}}
async function shipGo(id){const o=orders.find(x=>x[0]===id),g=i=>$(i).value.trim(),e=m=>{$('#se').textContent=m};
 if(!/^[6-9]\d{9}$/.test(g('#sph')))return e('Enter a valid 10-digit mobile number.');
 if(!g('#sad')||!g('#sci')||!g('#sst')||!g('#spr'))return e('Fill address, city, state and product.');
 if(!/^\d{6}$/.test(g('#spn')))return e('Enter a 6-digit pincode.');
 if(!(+g('#swt')>0))return e('Weight must be above 0.');
 o[8]={phone:g('#sph'),addr:g('#sad'),pin:g('#spn'),city:g('#sci'),state:g('#sst'),prod:g('#spr'),kg:+g('#swt')};
 const btn=document.querySelector('[data-shipgo]');btn.disabled=true;btn.textContent='Creating...';e('');
 try{const r=await sapi('POST','/api/shipments',{courier:g('#sc'),orderId:id,to:{name:o[1],phone:o[8].phone,line1:o[8].addr,city:o[8].city,state:o[8].state,pincode:o[8].pin},
   parcel:{paymentMode:o[3],declaredValue:o[4],codAmount:o[3]==='COD'?o[4]:undefined,weightGrams:Math.round(o[8].kg*1000),productDescription:o[8].prod,quantity:1}});
  const s=r.shipment;o[9]=s.id;
  if(!s.dryRun){o[5]=s.courier[0].toUpperCase()+s.courier.slice(1);o[6]=s.awb;o[7]='Pickup scheduled'}
  $('#dr').innerHTML=`<div class="row"><h1 style="font-size:20px;margin:0">${s.dryRun?'Dry run complete':'Shipment created'}</h1><button class="ib" data-close aria-label="Close">✕</button></div>
  <div class="card"><p class="sub" style="margin:0">AWB</p><b style="font-size:20px">${esc(s.awb)}</b><p class="sub" style="font-size:13px">${esc(s.courier)} for ${esc(id)}${r.reused?' (already existed, nothing new was booked)':''}</p></div>
  ${r.notice?`<div class="card" style="margin-top:10px"><b class="dn">${esc(r.notice)}</b></div>`:''}
  ${s.dryRun?'':`<button class="btn sec" style="margin-top:12px" data-shipcancel="${esc(s.id)}" data-oid="${esc(id)}">Cancel this shipment</button>`}`;
  render()}catch(x){if(x.status===401)return shipForm(o,'Session expired. Connect again.');btn.disabled=false;btn.textContent='Create shipment';e(x.message)}}
async function shipCancel(sid){const oid=document.querySelector('[data-shipcancel]').dataset.oid,o=orders.find(x=>x[0]===oid);
 try{await sapi('POST','/api/shipments/'+sid+'/cancel');o[5]='—';o[6]='—';o[7]='Ready to ship';delete o[9];$('#dr').classList.remove('open');toast('Shipment cancelled. Order is ready to ship again.');render()}catch(x){toast(x.message)}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function closeNav(){$('#side').classList.remove('open');$('#scrim').classList.remove('show')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-range],[data-sf],[data-shf],[data-track],[data-close],[data-act],[data-amt],[data-bulk],[data-lt],[data-lsw],[data-tab],[data-doc],[data-save],[data-submit],[data-kyc],[data-tog],[data-cc],[data-gate],[data-neworder],[data-ordsave],[data-shipnow],[data-srvlogin],[data-shipgo],[data-shipcancel],[data-toast]');if(!t)return;
if(t.dataset.go){cur=t.dataset.go;closeNav();$('#dr').classList.remove('open');window.scrollTo(0,0);render()}
else if(t.dataset.range){range=t.dataset.range;render()}
else if(t.dataset.sf){sf=t.dataset.sf;render()}
else if(t.dataset.shf){shf=t.dataset.shf;render()}
else if(t.dataset.track)track(t.dataset.track)
else if(t.dataset.close!==undefined)$('#dr').classList.remove('open')
else if(t.dataset.act){const id=t.dataset.id;ndr=ndr.filter(n=>n[0]!==id);toast({reattempt:'Reattempt booked for ',address:'Address updated and reattempt booked for ',cancel:'Order cancelled: ',rto:'Return started for '}[t.dataset.act]+id);render()}
else if(t.dataset.amt){const a=+t.dataset.amt;ledger.push(['Recharge','PAY-'+(2300+ledger.length),0,a]);toast('Payment verified. '+inr(a)+' added to your wallet.');render()}
else if(t.dataset.bulk){const n=document.querySelectorAll('.ck:checked').length;toast(n?(t.dataset.bulk==='labels'?'Preparing labels for ':'Manifest created for ')+n+' shipment'+(n>1?'s':''):'Select at least one shipment first')}
else if(t.dataset.lt){lt=t.dataset.lt;showLogin()}
else if(t.hasAttribute('data-lsw')){signup=!signup;showLogin()}
else if(t.dataset.tab){kt=t.dataset.tab;render()}
else if(t.dataset.doc){docs[t.dataset.doc]=1;toast('Document uploaded');render()}
else if(t.dataset.shipnow)shipNow(t.dataset.shipnow)
else if(t.hasAttribute('data-srvlogin'))srvLogin()
else if(t.dataset.shipgo)shipGo(t.dataset.shipgo)
else if(t.dataset.shipcancel)shipCancel(t.dataset.shipcancel)
else if(t.hasAttribute('data-neworder'))newOrder()
else if(t.hasAttribute('data-ordsave'))saveOrder()
else if(t.dataset.save){kyc.flags[t.dataset.save]=1;toast(t.dataset.save+' details saved');render()}
else if(t.hasAttribute('data-submit')){kyc.status='Under review';sellers[meIdx][2]='Under review';toast('KYC submitted for review');render()}
else if(t.dataset.kyc){const i=+t.dataset.i,s={approve:'Approved',reject:'Rejected',changes:'Changes requested'}[t.dataset.kyc];sellers[i][2]=s;if(i===meIdx)kyc.status=s;toast(sellers[i][0]+': '+s);render()}
else if(t.dataset.tog){const r=sellers[+t.dataset.tog];r[5]=!r[5];toast(r[0]+(r[5]?' activated':' suspended'));render()}
else if(t.dataset.cc){cc=+t.dataset.cc;render()}
else if(t.dataset.gate){toast(kyc.status==='Approved'?t.dataset.gate:'Get your KYC approved before creating shipments')}
else toast(t.dataset.toast)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.pin&&/^\d{6}$/.test(e.target.value.trim()))e.target.dispatchEvent(new Event('change',{bubbles:true}))});
document.addEventListener('change',async e=>{const pn=e.target.dataset&&e.target.dataset.pin;if(pn){const h=document.getElementById(pn),v=e.target.value.trim();if(h){if(!/^\d{6}$/.test(v)){h.innerHTML=v?'<span class="dn">Enter 6 digits</span>':'';}else{h.textContent='Checking…';const i=await pinInfo(v);h.innerHTML=pinText(i);const f=e.target.dataset.fill;if(f&&i.ok)document.getElementById(f).value=i.city+', '+i.state}}}
const m=e.target.dataset&&e.target.dataset.mg;if(m){mg[m]=Math.max(0,Math.min(100,+e.target.value||0));render()}});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#dr').classList.remove('open')});
$('#out').onclick=()=>{$('#dr').classList.remove('open');role=null;signup=false;showLogin()};
$('#menu').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('show')};
$('#scrim').onclick=closeNav;
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
showLogin();
</script>
</body>
</html>
